name: coevox-rbac
channels:
  - conda-forge
dependencies:
  # Match the benchmark's documented interpreter while keeping model serving and
  # SFT in CoEvoX's main environment.
  - python=3.10
  - pip
  - numpy
  - pandas
  - pyarrow
  - pyyaml
  - omegaconf
  - sqlparse
  - sqlglot
  - tqdm
  - requests
  - pytest
  - pip:
      - jsonschema>=4.18
      - func-timeout>=4.3.5
      - psycopg2-binary>=2.9.0
      - python-dotenv>=1.0.0
      - huggingface-hub[cli]>=0.24.0
      - gdown>=5.2.0
      # Imported transitively by the official BIRD evaluator's config package.
      - tiktoken==0.11.0
